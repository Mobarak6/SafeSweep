name: Release

# Push a tag like v1.0.0 to build, package and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --package

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/SafeSweep.dmg
            build/SafeSweep.zip
          generate_release_notes: true
          body: |
            ## Install

            1. Download **SafeSweep.dmg** below.
            2. Open it and drag **SafeSweep** into **Applications**.
            3. First launch only: open SafeSweep, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
               SafeSweep is open source and not notarized by Apple, so macOS asks once.

            Requires macOS 14 Sonoma or later. Universal: runs natively on Apple Silicon and Intel.
